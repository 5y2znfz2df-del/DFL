[package]
name = "dfl"
version = "0.1.0"
edition = "2021"
description = "DFL - a lightweight Minecraft Java Edition launcher"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
